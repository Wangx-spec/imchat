<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangGraph Chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
    }

    /* ── sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #0b1120;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #1e293b;
    }
    .sidebar-header h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #94a3b8;
      font-weight: 600;
    }
    #newChatBtn {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px dashed #334155;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    #newChatBtn:hover {
      background: #1e293b;
      border-color: #475569;
    }
    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 2px;
      transition: background .12s;
    }
    .conv-item:hover { background: #1e293b; }
    .conv-item.active {
      background: #1e293b;
      color: #e2e8f0;
    }
    .conv-main {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size: 11px;
      color: #475569;
      margin-top: 2px;
    }
    .conv-delete-btn {
      min-width: auto;
      padding: 4px 8px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .conv-delete-btn:hover {
      background: #3f1d1d;
      color: #f87171;
    }

    /* ── main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }
    .main-header {
      padding: 14px 20px;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sessionLabel {
      font-family: monospace;
      font-size: 12px;
      color: #475569;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .msg {
      margin: 8px 0;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .user { color: #93c5fd; }
    .assistant { color: #86efac; }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid #1e293b;
    }
    input, button {
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 10px 14px;
      background: #1e293b;
      color: #e5e7eb;
    }
    #messageInput {
      flex: 1;
      outline: none;
    }
    #messageInput:focus { border-color: #3b82f6; }
    button {
      cursor: pointer;
      min-width: 80px;
      transition: background .12s;
    }
    button:hover { background: #334155; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Conversations</h2>
      <button id="newChatBtn">+ New Chat</button>
    </div>
    <div id="convList" class="conv-list"></div>
  </aside>

  <div class="main">
    <div class="main-header">
      <span>LangGraph Chat</span>
      <span id="sessionLabel"></span>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="toolbar">
      <input id="messageInput" type="text" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const convList = document.getElementById("convList");
    const sessionLabel = document.getElementById("sessionLabel");

    let sessionId = null;

    /* ── conversation management ── */

    async function fetchConversations() {
      try {
        const res = await fetch("/api/conversations");
        if (!res.ok) return [];
        return await res.json();
      } catch { return []; }
    }

    async function createConversation() {
      try {
        const res = await fetch("/api/conversations", { method: "POST" });
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }

    async function deleteConversationById(id) {
      try {
        const res = await fetch(`/api/conversations/${id}`, {
          method: "DELETE"
        });
        return res.ok;
      } catch {
        return false;
      }
    }

    function renderConvList(conversations) {
      convList.innerHTML = "";
      for (const c of conversations) {
        const div = document.createElement("div");
        div.className = "conv-item" + (c.session_id === sessionId ? " active" : "");

        const main = document.createElement("div");
        main.className = "conv-main";

        const titleDiv = document.createElement("div");
        titleDiv.className = "conv-title";
        titleDiv.textContent = c.title || "New Chat";

        const timeDiv = document.createElement("div");
        timeDiv.className = "conv-time";
        timeDiv.textContent = formatTime(c.updated_at);

        main.appendChild(titleDiv);
        main.appendChild(timeDiv);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "conv-delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", async (e) => {
          e.stopPropagation();

          const confirmed = confirm(`Delete conversation "${c.title || c.session_id.slice(0, 8)}"?`);
          if (!confirmed) return;

          const deletedCurrent = c.session_id === sessionId;
          const ok = await deleteConversationById(c.session_id);
          if (!ok) {
            appendMessage("assistant", "Error: failed to delete conversation.");
            return;
          }

          const list = await fetchConversations();
          renderConvList(list);

          if (deletedCurrent) {
            if (list.length > 0) {
              await switchSession(list[0].session_id);
            } else {
              await handleNewChat();
            }
          }
        });

        div.addEventListener("click", () => switchSession(c.session_id));

        div.appendChild(main);
        div.appendChild(deleteBtn);
        convList.appendChild(div);
      }
    }

    function formatTime(isoStr) {
      if (!isoStr) return "";
      try {
        const d = new Date(isoStr);
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } catch { return isoStr; }
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text;
      return d.innerHTML;
    }

    async function switchSession(newId) {
      sessionId = newId;
      sessionLabel.textContent = sessionId ? sessionId.slice(0, 8) + "..." : "";
      chatBox.innerHTML = "";

      try {
        const res = await fetch(`/api/conversations/${sessionId}/messages`);
        if (res.ok) {
          const messages = await res.json();
          for (const m of messages) {
            appendMessage(m.role, m.content);
          }
        }
      } catch {}

      if (!chatBox.children.length) {
        appendMessage("assistant", "No messages yet.");
      }
      messageInput.focus();
      await refreshConvList();
    }

    async function refreshConvList() {
      const list = await fetchConversations();
      renderConvList(list);
    }

    async function handleNewChat() {
      const data = await createConversation();
      if (!data || !data.session_id) {
        appendMessage("assistant", "Error: failed to create conversation.");
        return;
      }
      sessionId = data.session_id;
      sessionLabel.textContent = sessionId.slice(0, 8) + "...";
      chatBox.innerHTML = "";
      appendMessage("assistant", "New conversation started.");
      messageInput.focus();
      await refreshConvList();
    }

    /* ── chat ── */

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = `${role === "user" ? "You" : "Assistant"}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function decodeSseFrames(buffer) {
      const frames = [];
      let rest = buffer;
      while (true) {
        const idx = rest.indexOf("\n\n");
        if (idx === -1) break;
        frames.push(rest.slice(0, idx));
        rest = rest.slice(idx + 2);
      }
      return { frames, rest };
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message || !sessionId) return;
      appendMessage("user", message);
      messageInput.value = "";
      sendBtn.disabled = true;

      try {
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message })
        });
        if (!response.ok) {
          const data = await response.json();
          appendMessage("assistant", `Error: ${data.detail || "request failed"}`);
          return;
        }
        if (!response.body) {
          appendMessage("assistant", "Error: stream not available");
          return;
        }

        const assistantNode = appendMessage("assistant", "");
        let assistantText = "";
        let pending = "";
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          pending += decoder.decode(value, { stream: true });
          const parsed = decodeSseFrames(pending);
          pending = parsed.rest;

          for (const frame of parsed.frames) {
            const lines = frame.split("\n");
            let eventName = "message";
            const dataLines = [];

            for (const line of lines) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trim());
              }
            }
            if (!dataLines.length) continue;

            let payload = null;
            try { payload = JSON.parse(dataLines.join("\n")); }
            catch { continue; }

            if (eventName === "chunk") {
              assistantText += (payload.text || "");
              assistantNode.textContent = `Assistant: ${assistantText}`;
              chatBox.scrollTop = chatBox.scrollHeight;
            } else if (eventName === "done") {
              if (!assistantText) {
                assistantText = payload.answer || "";
                assistantNode.textContent = `Assistant: ${assistantText}`;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } else if (eventName === "error") {
              assistantNode.textContent = `Assistant: Error: ${payload.detail || "stream failed"}`;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          }
        }

        if (!assistantText) {
          assistantNode.textContent = "Assistant: No answer";
        }
      } catch (err) {
        appendMessage("assistant", `Error: ${err}`);
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
        await refreshConvList();
      }
    }

    /* ── event listeners ── */

    sendBtn.addEventListener("click", sendMessage);
    newChatBtn.addEventListener("click", handleNewChat);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    /* ── init ── */

    (async function init() {
      const conversations = await fetchConversations();
      if (conversations.length > 0) {
        renderConvList(conversations);
        await switchSession(conversations[0].session_id);
      } else {
        await handleNewChat();
      }
      messageInput.focus();
    })();
  </script>
</body>
</html>
