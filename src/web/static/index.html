<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LangGraph Chat Tester</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      max-width: 860px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .chat-box {
      height: 480px;
      overflow-y: auto;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px;
      background: #030712;
    }
    .msg {
      margin: 8px 0;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user { color: #93c5fd; }
    .assistant { color: #86efac; }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input, button {
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      padding: 10px;
      background: #1f2937;
      color: #e5e7eb;
    }
    #messageInput { flex: 1; }
    button { cursor: pointer; min-width: 96px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h1>LangGraph Chat Tester</h1>
      <div id="chatBox" class="chat-box"></div>
      <div class="toolbar">
        <input id="messageInput" type="text" placeholder="Type message, e.g. what time is it?" />
        <button id="sendBtn">Send</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div class="tip">Try: "What time is it?" or "calculate (12 + 8) * 3 / 2"</div>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const sessionKey = "lc_chat_session_id";
    const sessionId = localStorage.getItem(sessionKey) || crypto.randomUUID();
    localStorage.setItem(sessionKey, sessionId);

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = `${role === "user" ? "You" : "Assistant"}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function decodeSseFrames(buffer) {
      const frames = [];
      let rest = buffer;
      while (true) {
        const idx = rest.indexOf("\n\n");
        if (idx === -1) break;
        frames.push(rest.slice(0, idx));
        rest = rest.slice(idx + 2);
      }
      return { frames, rest };
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      appendMessage("user", message);
      messageInput.value = "";
      sendBtn.disabled = true;

      try {
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message })
        });
        if (!response.ok) {
          const data = await response.json();
          appendMessage("assistant", `Error: ${data.detail || "request failed"}`);
          return;
        }

        if (!response.body) {
          appendMessage("assistant", "Error: stream not available");
          return;
        }

        const assistantNode = appendMessage("assistant", "");
        let assistantText = "";
        let pending = "";

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          pending += decoder.decode(value, { stream: true });
          const parsed = decodeSseFrames(pending);
          pending = parsed.rest;

          for (const frame of parsed.frames) {
            const lines = frame.split("\n");
            let eventName = "message";
            const dataLines = [];

            for (const line of lines) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trim());
              }
            }

            if (!dataLines.length) continue;

            let payload = null;
            try {
              payload = JSON.parse(dataLines.join("\n"));
            } catch (err) {
              continue;
            }

            if (eventName === "chunk") {
              const text = payload.text || "";
              assistantText += text;
              assistantNode.textContent = `Assistant: ${assistantText}`;
              chatBox.scrollTop = chatBox.scrollHeight;
            } else if (eventName === "done") {
              if (!assistantText) {
                assistantText = payload.answer || "";
                assistantNode.textContent = `Assistant: ${assistantText}`;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } else if (eventName === "error") {
              const detail = payload.detail || "stream failed";
              assistantNode.textContent = `Assistant: Error: ${detail}`;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          }
        }

        if (!assistantText) {
          assistantNode.textContent = "Assistant: No answer";
        }
      } catch (err) {
        appendMessage("assistant", `Error: ${err}`);
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    async function resetSession() {
      try {
        await fetch("/api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        });
      } catch (err) {
      }
      chatBox.innerHTML = "";
      appendMessage("assistant", "Session reset.");
      messageInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    resetBtn.addEventListener("click", resetSession);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    appendMessage("assistant", "Web chat is ready (stream mode).");
    messageInput.focus();
  </script>
</body>
</html>
